<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#F6F7F9;}body{overscroll-behavior:none;font-family:'Noto Sans',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "primary": "#00152a", "surface-container-high": "#e5e8ef", "on-tertiary": "#ffffff", "secondary-fixed": "#ffddb4", "on-tertiary-fixed-variant": "#5f4119", "surface-bg": "#F6F7F9", "surface-card": "#FFFFFF", "surface-bright": "#f8f9ff", "secondary-container": "#feaa11", "primary-fixed": "#d1e4ff", "on-primary-fixed-variant": "#304864", "inverse-primary": "#b0c9ea", "on-secondary-fixed": "#291800", "surface": "#f8f9ff", "on-primary-container": "#7992b1", "surface-container-lowest": "#ffffff", "surface-container-highest": "#e0e2e9", "on-tertiary-fixed": "#2a1700", "primary-container": "#0f2a44", "live-blue": "#1A73E8", "verified-green": "#1E8E3E", "on-error": "#ffffff", "tertiary-fixed": "#ffddb8", "on-primary-fixed": "#001d36", "inverse-surface": "#2d3136", "on-surface-variant": "#43474d", "error-container": "#ffdad6", "inverse-on-surface": "#eef1f8", "surface-dim": "#d7dae1", "outline-variant": "#c3c6ce", "background": "#f8f9ff", "on-tertiary-container": "#af895a", "error": "#ba1a1a", "text-secondary": "#5F6B7A", "surface-container": "#ebeef5", "on-secondary": "#ffffff", "surface-container-low": "#f1f4fb", "outline": "#74777e", "rejected-red": "#D93025", "primary-fixed-dim": "#b0c9ea", "on-background": "#181c21", "tertiary-fixed-dim": "#ebbf8c", "border-subtle": "#E3E6EA", "on-secondary-fixed-variant": "#633f00", "secondary": "#825500", "tertiary": "#201100", "tertiary-container": "#3c2300", "surface-variant": "#e0e2e9", "secondary-fixed-dim": "#ffb952", "surface-tint": "#48607d", "on-primary": "#ffffff", "review-orange": "#E37400", "on-secondary-container": "#694300", "on-surface": "#181c21", "on-error-container": "#93000a" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xl": "2rem", "space-xs": "0.25rem", "gutter": "1rem", "margin": "1.5rem", "space-lg": "1.5rem", "margin-mobile": "1rem", "gutter-mobile": "0.75rem", "space-md": "1rem", "space-sm": "0.5rem" }, "fontFamily": { "headline-md": ["Noto Sans"], "body-md": ["Noto Sans"], "headline-lg": ["Noto Sans"], "headline-sm": ["Noto Sans"], "label-md": ["Noto Sans"], "headline-lg-mobile": ["Noto Sans"], "data-display": ["Noto Sans"], "label-sm": ["Noto Sans"], "body-lg": ["Noto Sans"], "label-lg": ["Noto Sans"] }, "fontSize": { "headline-md": ["20px", { "lineHeight": "26px", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "label-md": ["13px", { "lineHeight": "18px", "fontWeight": "500" }], "headline-lg-mobile": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "data-display": ["28px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-sm": ["11px", { "lineHeight": "16px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-lg": ["16px", { "lineHeight": "20px", "fontWeight": "600" }] } } } }</script></head><body class="bg-surface-bg text-on-surface pt-safe pb-safe min-h-screen flex flex-col"><main class="flex-1 flex flex-col relative w-full bg-surface-bg px-margin-mobile"><div class="flex flex-col w-full pb-6 select-none">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between py-4">
<button aria-label="Back to sign in" class="flex items-center justify-center w-12 h-12 rounded-xl bg-surface-container-low text-primary active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[26px]">arrow_back</span>
</button>
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container text-text-secondary">
<span class="material-symbols-outlined text-[16px] text-verified-green" style="font-variation-settings: 'FILL' 1;">shield</span>
<span class="font-label-sm text-label-sm tracking-wide">SECURE CABIN LOGIN</span>
</div>
</header>
<!-- Title & Subtitle Section -->
<section class="mt-2 mb-6">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Enter the code</h1>
<p class="font-body-md text-body-md text-text-secondary mt-1 flex items-center gap-1.5 flex-wrap">
<span>Sent to +91 98xxx x4521</span>
<span>·</span>
<button class="text-primary font-label-md text-label-md underline underline-offset-4 active:opacity-70" type="button">Edit</button>
</p>
</section>
<!-- OTP Code Input Boxes Grid -->
<section class="my-2">
<div class="grid grid-cols-6 gap-2 w-full max-w-sm mx-auto" id="otp-container">
<!-- Box 1 -->
<div class="h-14 rounded-xl flex items-center justify-center bg-surface-card shadow-sm shadow-primary/5 transition-all text-primary font-data-display text-data-display">
        4
      </div>
<!-- Box 2 -->
<div class="h-14 rounded-xl flex items-center justify-center bg-surface-card shadow-sm shadow-primary/5 transition-all text-primary font-data-display text-data-display">
        8
      </div>
<!-- Box 3 -->
<div class="h-14 rounded-xl flex items-center justify-center bg-surface-card shadow-sm shadow-primary/5 transition-all text-primary font-data-display text-data-display">
        2
      </div>
<!-- Box 4 -->
<div class="h-14 rounded-xl flex items-center justify-center bg-surface-card shadow-sm shadow-primary/5 transition-all text-primary font-data-display text-data-display">
        9
      </div>
<!-- Box 5 (Active Cursor) -->
<div class="h-14 rounded-xl flex items-center justify-center bg-primary/5 shadow-md shadow-primary/10 transition-all text-primary font-data-display text-data-display relative">
<span class="w-0.5 h-7 bg-primary rounded-full animate-pulse"></span>
</div>
<!-- Box 6 -->
<div class="h-14 rounded-xl flex items-center justify-center bg-surface-card shadow-sm shadow-primary/5 transition-all text-primary font-data-display text-data-display">
</div>
</div>
<!-- Countdown & Resend Feedback -->
<div class="mt-6 flex items-center justify-center gap-2 text-text-secondary font-label-md text-label-md">
<div class="relative flex items-center justify-center w-5 h-5">
<svg class="w-5 h-5 -rotate-90" viewbox="0 0 36 36">
<circle class="text-surface-container-high" cx="18" cy="18" fill="none" r="14" stroke="currentColor" stroke-width="3"></circle>
<circle class="text-live-blue" cx="18" cy="18" fill="none" r="14" stroke="currentColor" stroke-dasharray="88" stroke-dashoffset="36" stroke-linecap="round" stroke-width="3"></circle>
</svg>
</div>
<span>Resend code in <strong class="text-primary font-semibold font-label-md text-label-md tabular-nums" id="timer-display">0:24</strong></span>
</div>
</section>
<!-- Primary Driver Action Button -->
<div class="mt-6 mb-4">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl flex items-center justify-center gap-3 font-label-lg text-label-lg shadow-md shadow-primary/20 active:scale-[0.98] transition-transform" type="button">
<span>Verify &amp; continue</span>
<span class="material-symbols-outlined text-[22px]">arrow_forward</span>
</button>
</div>
<!-- Operational In-Cab Keypad -->
<section aria-label="Cabin Numeric Pad" class="mt-auto pt-2 bg-surface-card rounded-2xl shadow-sm p-2">
<div class="grid grid-cols-3 gap-2">
<!-- 1 -->
<button class="h-14 rounded-xl bg-surface-container-low flex flex-col items-center justify-center active:bg-surface-container-high transition-colors" type="button">
<span class="font-headline-md text-headline-md text-primary leading-none">1</span>
<span class="font-label-sm text-[9px] text-text-secondary tracking-widest mt-0.5 opacity-60"> </span>
</button>
<!-- 2 -->
<button class="h-14 rounded-xl bg-surface-container-low flex flex-col items-center justify-center active:bg-surface-container-high transition-colors" type="button">
<span class="font-headline-md text-headline-md text-primary leading-none">2</span>
<span class="font-label-sm text-[9px] text-text-secondary tracking-widest mt-0.5">ABC</span>
</button>
<!-- 3 -->
<button class="h-14 rounded-xl bg-surface-container-low flex flex-col items-center justify-center active:bg-surface-container-high transition-colors" type="button">
<span class="font-headline-md text-headline-md text-primary leading-none">3</span>
<span class="font-label-sm text-[9px] text-text-secondary tracking-widest mt-0.5">DEF</span>
</button>
<!-- 4 -->
<button class="h-14 rounded-xl bg-surface-container-low flex flex-col items-center justify-center active:bg-surface-container-high transition-colors" type="button">
<span class="font-headline-md text-headline-md text-primary leading-none">4</span>
<span class="font-label-sm text-[9px] text-text-secondary tracking-widest mt-0.5">GHI</span>
</button>
<!-- 5 -->
<button class="h-14 rounded-xl bg-surface-container-low flex flex-col items-center justify-center active:bg-surface-container-high transition-colors" type="button">
<span class="font-headline-md text-headline-md text-primary leading-none">5</span>
<span class="font-label-sm text-[9px] text-text-secondary tracking-widest mt-0.5">JKL</span>
</button>
<!-- 6 -->
<button class="h-14 rounded-xl bg-surface-container-low flex flex-col items-center justify-center active:bg-surface-container-high transition-colors" type="button">
<span class="font-headline-md text-headline-md text-primary leading-none">6</span>
<span class="font-label-sm text-[9px] text-text-secondary tracking-widest mt-0.5">MNO</span>
</button>
<!-- 7 -->
<button class="h-14 rounded-xl bg-surface-container-low flex flex-col items-center justify-center active:bg-surface-container-high transition-colors" type="button">
<span class="font-headline-md text-headline-md text-primary leading-none">7</span>
<span class="font-label-sm text-[9px] text-text-secondary tracking-widest mt-0.5">PQRS</span>
</button>
<!-- 8 -->
<button class="h-14 rounded-xl bg-surface-container-low flex flex-col items-center justify-center active:bg-surface-container-high transition-colors" type="button">
<span class="font-headline-md text-headline-md text-primary leading-none">8</span>
<span class="font-label-sm text-[9px] text-text-secondary tracking-widest mt-0.5">TUV</span>
</button>
<!-- 9 -->
<button class="h-14 rounded-xl bg-surface-container-low flex flex-col items-center justify-center active:bg-surface-container-high transition-colors" type="button">
<span class="font-headline-md text-headline-md text-primary leading-none">9</span>
<span class="font-label-sm text-[9px] text-text-secondary tracking-widest mt-0.5">WXYZ</span>
</button>
<!-- Spacer/Help -->
<button class="h-14 rounded-xl flex items-center justify-center text-text-secondary active:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined text-[24px]">support_agent</span>
</button>
<!-- 0 -->
<button class="h-14 rounded-xl bg-surface-container-low flex flex-col items-center justify-center active:bg-surface-container-high transition-colors" type="button">
<span class="font-headline-md text-headline-md text-primary leading-none">0</span>
<span class="font-label-sm text-[9px] text-text-secondary tracking-widest mt-0.5">+</span>
</button>
<!-- Backspace -->
<button aria-label="Delete digit" class="h-14 rounded-xl bg-surface-container-low flex items-center justify-center text-primary active:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-[26px]">backspace</span>
</button>
</div>
</section>
</div>
<script>
  // Simple interactive micro-countdown for driver feedback
  let secondsRemaining = 24;
  const timerElem = document.getElementById('timer-display');
  if (timerElem) {
    const timerInterval = setInterval(() => {
      if (secondsRemaining > 0) {
        secondsRemaining--;
        const formatted = secondsRemaining < 10 ? '0' + secondsRemaining : secondsRemaining;
        timerElem.textContent = '0:' + formatted;
      } else {
        clearInterval(timerInterval);
        timerElem.parentElement.innerHTML = '<button type="button" class="text-live-blue font-label-md text-label-md underline underline-offset-2">Resend OTP now</button>';
      }
    }, 1000);
  }
</script></main></body></html>
