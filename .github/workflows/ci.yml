name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Unit tests
        run: bun run test

      # Mod-level app.config checks: the merged Android manifest and iOS
      # Info.plist via `expo config --type introspect` (validation M3, M11).
      - name: App config (introspect)
        run: bun run test:config

      # The console ships as a static web export. It broke on main without CI
      # noticing (validation report B1: expo-sqlite's wasm was unresolvable),
      # so build it on every PR.
      # Probe values, not real ones: the next step checks Metro inlined them
      # (validation M2 — main's config read `process.env` as a whole object,
      # which a production bundle never fills, so every release fell back).
      - name: Web export (production)
        run: bun run export:web
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: https://ci-probe.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-probe-anon-key

      - name: Web export carries the EXPO_PUBLIC_* values
        run: |
          grep -rqF "https://ci-probe.supabase.co" dist || { echo "::error::SUPABASE_URL not inlined"; exit 1; }
          grep -rqF "ci-probe-anon-key" dist || { echo "::error::SUPABASE_ANON_KEY not inlined"; exit 1; }

      # The Supabase Edge Functions have their own Deno test suite, including a
      # wire-format suite that starts a loopback HTTP server (`--allow-net`).
      # It needs no secrets, so it belongs here: two real `mappls-proxy` bugs
      # (restricted geometry parsing as (0,0), and a 204 read as a broken
      # response) were found by it and would otherwise be invisible to CI.
      #
      # The Playwright console spec is deliberately NOT run here: it needs a
      # live Supabase project and a deployed `mappls-proxy` with a real
      # `MAPPLS_REST_KEY`, so it belongs on a machine that has them, not on a
      # PR runner. It skips with the missing key names when unconfigured.
      - name: Edge function tests (Deno)
        working-directory: supabase/functions
        run: bunx deno test --allow-env --allow-net

  # Every migration from zero plus the seed, then the pgTAP suites in
  # supabase/tests (RLS, RPC errors, verification). Only Postgres is started,
  # so it needs no secrets. Before this job existed the pgTAP suites never ran
  # in CI (validation report 0.4), and the admin trip-write bypass (B2) got in.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Start Postgres (migrations + seed)
        run: supabase db start

      - name: pgTAP
        run: supabase test db
