name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      # docs/09 §4 "npm audit in CI". Gate on critical only: the current high
      # (react-server-dom-webpack, RSC server DoS) is not reachable in our static web
      # export — see docs/HARDENING_REPORT.md. Raise to high once it is bumped.
      - name: Audit (runtime deps)
        run: npm audit --omit=dev --audit-level=critical

  database:
    # pgTAP: RLS on every table + profile RPCs (supabase/tests/*.test.sql).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Start Postgres (applies migrations + seed)
        run: supabase db start

      - name: pgTAP
        run: supabase test db
